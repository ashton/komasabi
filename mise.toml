[tools]
"cargo:diesel_cli" = { version = "latest", features = ["sqlite"], default-features = false }

[env]
DATABASE_URL = "komasabi.sqlite3"

[tasks."migration:setup"]
description = "Create the sqlite database and run pending migrations"
dir = "app"
run = "diesel setup"

[tasks."migration:generate"]
description = "Generate a new migration"
dir = "app"
usage = '''
arg "<name>" help="Migration name (e.g. a table name)"
'''
run = 'diesel migration generate "${usage_name}"'

[tasks."migration:apply"]
description = "Run pending migrations"
dir = "app"
run = "diesel migration run"

[tasks."cargo:run"]
description = "Run the application using cargo run through mise"
dir = "app"
# The app spawns the reader binary from its own target directory, so build it
# first — `cargo run` for the app alone wouldn't.
run = ["cargo build -p komasabi-reader --bin komasabi-reader", "cargo run"]

[tasks."cargo:run-reader"]
description = "Run the standalone comic reader against a folder of images"
dir = "reader"
run = "cargo run --"
