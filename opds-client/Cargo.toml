[package]
name = "opds-client"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "An async client for OPDS catalogs that reads OPDS 2 (JSON) and OPDS 1.2 (Atom) into one model"
keywords = ["opds", "ebooks", "comics", "catalog", "atom"]
categories = ["api-bindings", "parser-implementations", "web-programming::http-client"]

[dependencies]
quick-xml = "0.41"
reqwest = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
wiremock = "0.6.5"
