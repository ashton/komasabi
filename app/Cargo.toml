[package]
name = "komasabi"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "A desktop app that gathers your comic and manga libraries (local folders, Kavita, Komga, Suwayomi, OPDS) in one place"
readme = "../README.md"
keywords = ["comics", "manga", "reader", "kavita", "komga"]
categories = ["gui", "multimedia::images"]

# Installers, built with `cargo packager` (see .github/workflows/release.yml).
[package.metadata.packager]
product-name = "Komasabi"
identifier = "io.github.ashton.komasabi"
publisher = "Matheus Ashton"
copyright = "Copyright (c) 2026 Matheus Ashton"
category = "GraphicsAndDesign"
license-file = "../LICENSE"
icons = ["assets/komasabi-icon.png"]

[package.metadata.packager.nsis]
installer-icon = "assets/komasabi.ico"

# Also the desktop entry of the AppImage and pacman package, which reuse the
# .deb's file tree.
[package.metadata.packager.deb]
desktop-template = "packaging/komasabi.desktop"

# The PKGBUILD is patched after packaging by packaging/patch-pkgbuild.sh.
[package.metadata.packager.pacman]
depends = ["gcc-libs", "glibc"]

# The .rpm (Fedora, openSUSE, …), built with `cargo generate-rpm -p app` from
# the workspace root after a release build.
[package.metadata.generate-rpm]
assets = [
    { source = "target/release/komasabi", dest = "/usr/bin/komasabi", mode = "755" },
    { source = "packaging/komasabi.desktop", dest = "/usr/share/applications/komasabi.desktop", mode = "644" },
    { source = "assets/komasabi-icon.png", dest = "/usr/share/icons/hicolor/256x256/apps/komasabi.png", mode = "644" },
]

[features]
default = ["kavita", "komga", "opds", "suwayomi"]
kavita = ["dep:kavita-client", "dep:reqwest", "dep:url"]
komga = ["dep:komga-client", "dep:reqwest", "dep:url"]
opds = ["dep:opds-client", "dep:base64", "dep:reqwest", "dep:unrar", "dep:url"]
suwayomi = ["dep:suwayomi-client", "dep:url"]

[dependencies]
base64 = { version = "0.22", optional = true }
chrono = "0.4"
diesel = { version = "2.2.0", features = ["chrono", "returning_clauses_for_sqlite_3_35", "sqlite"] }
diesel-async = { version = "0.7.0", features = ["sqlite"] }
diesel_migrations = { version = "2.3", features = ["sqlite"] }
diesel-derive-enum = { version = "3.0.0-beta.1", features = ["sqlite"] }
directories = "6"
iced = { version = "0.14.0", features = ["image", "svg", "advanced"] }
iced_anim = "0.3.1"
iced_font_awesome = "0.4.4"
interprocess = "2"
kavita-client = { workspace = true, optional = true }
komga-client = { workspace = true, optional = true }
opds-client = { workspace = true, optional = true }
reqwest = { version = "0.13", optional = true }
komasabi-reader.workspace = true
# Compiles SQLite into the binary: Windows has no system SQLite for diesel to
# link against, and every platform then runs the same version.
libsqlite3-sys = { version = "0.38", features = ["bundled"] }
suwayomi-client = { workspace = true, optional = true }
serde_json = "1"
rfd = { version = "0.17.2", features = ["xdg-portal"] }
tokio = { version = "1", features = ["rt", "sync"] }
tracing = "0.1"
unrar = { version = "0.5", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2", optional = true }
uuid = { version = "1", features = ["v4"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[dev-dependencies]
iced_test = "0.14.0"
tokio = { version = "1", features = ["macros", "rt"] }
wiremock = "0.6.5"

[build-dependencies]
winresource = "0.1.34"
