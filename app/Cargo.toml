[package]
name = "sabita-app"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
chrono = "0.4"
diesel = { version = "2.2.0", features = ["chrono", "returning_clauses_for_sqlite_3_35", "sqlite"] }
diesel-async = { version = "0.7.0", features = ["sqlite"] }
diesel-derive-enum = { version = "3.0.0-beta.1", features = ["sqlite"] }
directories = "6"
iced = { version = "0.14.0", features = ["image", "svg", "advanced"] }
iced_anim = "0.3.1"
iced_font_awesome = "0.4.4"
iced_test = "0.14.0"
interprocess = "2"
kavita-client = { path = "../kavita-client" }
komga-client = { path = "../komga-client" }
opds-client = { path = "../opds-client" }
reqwest = "0.13"
sabita-reader = { path = "../reader" }
serde_json = "1"
rfd = { version = "0.17.2", features = ["xdg-portal"] }
tokio = { version = "1", features = ["rt", "sync"] }
tracing = "0.1"
unrar = "0.5"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
wiremock = "0.6.5"
