[package]
name = "komasabi-app"
version = "0.1.0"
edition = "2024"

[features]
default = ["kavita", "komga", "opds", "suwayomi"]
kavita = ["dep:kavita-client", "dep:reqwest", "dep:url"]
komga = ["dep:komga-client", "dep:reqwest", "dep:url"]
opds = ["dep:opds-client", "dep:base64", "dep:reqwest", "dep:unrar", "dep:url"]
suwayomi = ["dep:suwayomi-client", "dep:url"]

[dependencies]
base64 = { version = "0.22", optional = true }
chrono = "0.4"
diesel = { version = "2.2.0", features = ["chrono", "returning_clauses_for_sqlite_3_35", "sqlite"] }
diesel-async = { version = "0.7.0", features = ["sqlite"] }
diesel_migrations = { version = "2.3", features = ["sqlite"] }
diesel-derive-enum = { version = "3.0.0-beta.1", features = ["sqlite"] }
directories = "6"
iced = { version = "0.14.0", features = ["image", "svg", "advanced"] }
iced_anim = "0.3.1"
iced_font_awesome = "0.4.4"
iced_test = "0.14.0"
interprocess = "2"
kavita-client = { path = "../kavita-client", optional = true }
komga-client = { path = "../komga-client", optional = true }
opds-client = { path = "../opds-client", optional = true }
reqwest = { version = "0.13", optional = true }
komasabi-reader = { path = "../reader" }
suwayomi-client = { path = "../suwayomi-client", optional = true }
serde_json = "1"
rfd = { version = "0.17.2", features = ["xdg-portal"] }
tokio = { version = "1", features = ["rt", "sync"] }
tracing = "0.1"
unrar = { version = "0.5", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2", optional = true }
uuid = { version = "1", features = ["v4"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
wiremock = "0.6.5"
