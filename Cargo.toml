[workspace]
resolver = "3"
members = ["app", "kavita-client", "komga-client", "opds-client", "reader", "suwayomi-client"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Matheus Ashton <matheusashton@gmail.com>"]
repository = "https://github.com/ashton/komasabi"

# The crates publish together, so each internal dependency carries the version
# crates.io resolves it to alongside the path used in the workspace.
[workspace.dependencies]
kavita-client = { path = "kavita-client", version = "0.1.0" }
komasabi-reader = { path = "reader", version = "0.1.0" }
komga-client = { path = "komga-client", version = "0.1.0" }
opds-client = { path = "opds-client", version = "0.1.0" }
suwayomi-client = { path = "suwayomi-client", version = "0.1.0" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
