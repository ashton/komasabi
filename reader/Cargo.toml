[package]
name = "komasabi-reader"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "The page viewer window of the Komasabi comic and manga app"
keywords = ["comics", "manga", "reader", "viewer", "iced"]
categories = ["gui", "multimedia::images"]

[lib]
name = "komasabi_reader"
path = "src/lib.rs"

[[bin]]
name = "komasabi-reader"
path = "src/main.rs"

[dependencies]
iced = { version = "0.14.0", features = ["image", "advanced"] }
image = "0.25"
interprocess = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
